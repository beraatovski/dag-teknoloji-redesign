<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yönlendiriliyor | DAĞ TEKNOLOJİ</title>
  <script>
    (function() {
      var pathname = window.location.pathname;
      var clean = pathname.replace(/\/$/, '');
      var segments = clean.split('/').filter(Boolean);
      var last = segments[segments.length - 1] || '';
      
      // If path looks like a product stock code (e.g. /DT-4816, /stok/DT-4816, /urun/DT-4816)
      if (last && !last.includes('.html')) {
        window.location.replace('urun.html?stok=' + encodeURIComponent(last));
        return;
      }
      
      // If path was old urun-detay
      if (last.includes('urun-detay')) {
        var query = window.location.search;
        window.location.replace('urun.html' + query);
        return;
      }

      window.location.replace('index.html');
    })();
  </script>
</head>
<body style="background:#020617; color:#38bdf8; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
  <div style="text-align:center;">
    <p style="font-size:18px; font-weight:bold;">Sayfaya yönlendiriliyorsunuz...</p>
    <p style="font-size:13px; color:#94a3b8;">Lütfen bekleyiniz.</p>
  </div>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 95" width="100%" height="100%">
  <defs>
    <!-- Cyan to Blue Gradient -->
    <linearGradient id="dagCyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052cc" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Indigo to Violet Accent -->
    <linearGradient id="dagVioletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- LOGO EMBLEM (Left: 0 - 85) -->
  <g transform="translate(6, 6)">
    <!-- Base Mountain / 3D Layer Stack -->
    <!-- Layer 1 (Bottom foundation) -->
    <path d="M 5 70 L 75 70 L 70 63 L 10 63 Z" fill="#1e293b" />
    
    <!-- Layer 2 (3D Print Sliced Mountain - Base) -->
    <path d="M 12 60 L 68 60 L 63 51 L 17 51 Z" fill="url(#dagCyanGrad)" opacity="0.6" />

    <!-- Layer 3 (3D Print Sliced Mountain - Mid) -->
    <path d="M 19 48 L 61 48 L 56 39 L 24 39 Z" fill="url(#dagCyanGrad)" opacity="0.85" />

    <!-- Layer 4 (Mountain Peak + Precision Extruder Nozzle Triangle) -->
    <path d="M 40 8 L 53 36 L 27 36 Z" fill="url(#dagCyanGrad)" filter="url(#neonGlow)" />
    
    <!-- Isometric Cube / Core in the heart of Mountain -->
    <polygon points="40,22 49,27 40,32 31,27" fill="#ffffff" opacity="0.95" />
    <polygon points="31,27 40,32 40,41 31,36" fill="url(#dagVioletGrad)" />
    <polygon points="49,27 40,32 40,41 49,36" fill="#0052cc" />

    <!-- Futuristic Precision Dot -->
    <circle cx="40" cy="5" r="2.5" fill="#00f0ff" filter="url(#neonGlow)" />
  </g>

  <!-- BRAND TYPOGRAPHY: Unified text element prevents font metric clipping -->
  <text x="96" y="52" font-family="'Space Grotesk', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" letter-spacing="1.2" fill="#ffffff">
    DAĞ <tspan fill="url(#dagCyanGrad)" filter="url(#neonGlow)">TEKNOLOJİ</tspan>
  </text>

  <!-- Tagline / Subtitle -->
  <text x="98" y="72" font-family="'Space Grotesk', 'Plus Jakarta Sans', monospace, sans-serif" font-weight="700" font-size="10.5" letter-spacing="4" fill="#94a3b8">
    3D INNOVATION &amp; PRINT LAB
  </text>

  <!-- Tech Indicator Accent Line -->
  <rect x="98" y="78" width="300" height="1.5" fill="url(#dagCyanGrad)" opacity="0.4" />
  <circle cx="398" cy="78.75" r="2" fill="#00f0ff" />
</svg>

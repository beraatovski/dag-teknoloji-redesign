<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <!-- Cyan to Blue Gradient -->
    <linearGradient id="dagCyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052cc" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Indigo to Violet Accent -->
    <linearGradient id="dagVioletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- LOGO EMBLEM (Left: 0 - 90) -->
  <g transform="translate(10, 8)">
    <!-- Base Mountain / 3D Layer Stack -->
    <!-- Layer 1 (Bottom foundation - wide) -->
    <path d="M 5 72 L 75 72 L 70 65 L 10 65 Z" fill="#1e293b" />
    
    <!-- Layer 2 (3D Print Sliced Mountain - Base) -->
    <path d="M 12 62 L 68 62 L 63 53 L 17 53 Z" fill="url(#dagCyanGrad)" opacity="0.6" />

    <!-- Layer 3 (3D Print Sliced Mountain - Mid) -->
    <path d="M 19 50 L 61 50 L 56 41 L 24 41 Z" fill="url(#dagCyanGrad)" opacity="0.85" />

    <!-- Layer 4 (Mountain Peak + Precision Extruder Nozzle Triangle) -->
    <path d="M 40 10 L 53 38 L 27 38 Z" fill="url(#dagCyanGrad)" filter="url(#neonGlow)" />
    
    <!-- Isometric Cube / Core in the heart of Mountain -->
    <polygon points="40,24 49,29 40,34 31,29" fill="#ffffff" opacity="0.95" />
    <polygon points="31,29 40,34 40,43 31,38" fill="url(#dagVioletGrad)" />
    <polygon points="49,29 40,34 40,43 49,38" fill="#0052cc" />

    <!-- Futuristic Precision Crosshair Accent Dot -->
    <circle cx="40" cy="6" r="2.5" fill="#00f0ff" filter="url(#neonGlow)" />
  </g>

  <!-- BRAND TYPOGRAPHY (Right: 105 - 420) -->
  <!-- "DAĞ" -->
  <text x="104" y="52" font-family="'Space Grotesk', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="40" letter-spacing="1.5" fill="#ffffff">
    DAĞ
  </text>

  <!-- "TEKNOLOJİ" in Glowing Cyan -->
  <text x="202" y="52" font-family="'Space Grotesk', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="40" letter-spacing="1.5" fill="url(#dagCyanGrad)" filter="url(#neonGlow)">
    TEKNOLOJİ
  </text>

  <!-- Tagline / Subtitle -->
  <text x="106" y="73" font-family="'Space Grotesk', 'Inter', 'Segoe UI', monospace" font-weight="600" font-size="10.5" letter-spacing="4.5" fill="#94a3b8">
    3D INNOVATION &amp; PRINT LAB
  </text>

  <!-- Tech Indicator Accent Line -->
  <rect x="106" y="79" width="280" height="1.5" fill="url(#dagCyanGrad)" opacity="0.4" />
  <circle cx="386" cy="79.75" r="2" fill="#00f0ff" />
</svg>

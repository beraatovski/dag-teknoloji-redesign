<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlowDrum" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drumGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="25%" stop-color="#10b981"/>
      <stop offset="45%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="#030712" rx="16"/>
  <rect width="400" height="300" fill="url(#bgGlowDrum)" rx="16"/>

  <!-- Drum Unit Assembly -->
  <g transform="translate(40, 75)">
    <ellipse cx="160" cy="140" rx="145" ry="14" fill="#000000" opacity="0.6"/>

    <!-- Plastic Carrier Cradle Frame -->
    <rect x="15" y="25" width="290" height="95" rx="14" fill="url(#frameGrad)" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Exposed Optical Photoreceptor Drum Core (OPC Drum) -->
    <rect x="35" y="45" width="250" height="32" rx="16" fill="url(#drumGreen)" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
    <ellipse cx="285" cy="61" rx="5" ry="16" fill="#047857"/>

    <!-- Corona Wire Cleaning Slider Tab (Green Slider) -->
    <rect x="65" y="28" width="22" height="12" rx="3" fill="#10b981"/>
    <circle cx="76" cy="34" r="2" fill="#ffffff"/>

    <!-- Gear Mechanism on Left -->
    <circle cx="25" cy="61" r="14" fill="#1e293b" stroke="#00f0ff" stroke-width="1.8"/>
    <circle cx="25" cy="61" r="6" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5"/>

    <!-- Right Side High Voltage Contact -->
    <circle cx="295" cy="61" r="10" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
    <rect x="290" y="56" width="10" height="10" fill="#eab308"/>

    <!-- Metal Grounding Spring Pin -->
    <line x1="28" y1="88" x2="42" y2="88" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Technical Specification Label -->
    <rect x="95" y="88" width="130" height="26" rx="5" fill="#022c22" fill-opacity="0.6" stroke="#059669" stroke-width="1"/>
    <text x="160" y="101" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="1">OPC DRUM UNIT</text>
    <text x="160" y="110" fill="#99f6e4" font-family="monospace" font-size="7" text-anchor="middle">LONG-LIFE FOTORESEPTÖR</text>
  </g>

  <g transform="translate(20, 20)">
    <rect width="135" height="22" rx="11" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="12" cy="11" r="3.5" fill="#22d3ee"/>
    <text x="24" y="14.5" fill="#cffafe" font-family="system-ui, sans-serif" font-size="9" font-weight="600">DRUM / TAMBUR ÜNİTESİ</text>
  </g>
</svg>

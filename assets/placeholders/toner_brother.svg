<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlowBrother" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGradBrother" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="rollerBrother" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="#030712" rx="16"/>
  <rect width="400" height="300" fill="url(#bgGlowBrother)" rx="16"/>

  <g transform="translate(45, 75)">
    <ellipse cx="155" cy="140" rx="145" ry="16" fill="#000000" opacity="0.6"/>
    <!-- Brother Developing Roller -->
    <rect x="25" y="100" width="260" height="16" rx="8" fill="url(#rollerBrother)"/>
    
    <!-- Triangular / Wedge Brother Body -->
    <path d="M20,35 L290,35 L275,100 L35,100 Z" fill="url(#bodyGradBrother)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.3"/>

    <!-- Left White Reset Gear -->
    <circle cx="22" cy="50" r="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="22" cy="50" r="4" fill="#64748b"/>
    <polygon points="22,40 26,45 22,46" fill="#334155"/>

    <!-- Right Side Hopper Cap -->
    <circle cx="282" cy="50" r="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Handle -->
    <rect x="110" y="22" width="90" height="13" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>

    <!-- Ribs -->
    <g stroke="#334155" stroke-width="1.5">
      <line x1="50" y1="50" x2="260" y2="50"/>
      <line x1="50" y1="65" x2="260" y2="65"/>
      <line x1="50" y1="80" x2="260" y2="80"/>
    </g>

    <!-- Badge -->
    <rect x="95" y="52" width="120" height="36" rx="6" fill="#451a03" fill-opacity="0.5" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="155" y="69" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">BROTHER TN MUADİL</text>
    <text x="155" y="82" fill="#fde68a" font-family="monospace" font-size="8" text-anchor="middle">A+ STANDART TONER</text>
  </g>

  <g transform="translate(20, 20)">
    <rect width="135" height="22" rx="11" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="12" cy="11" r="3.5" fill="#fbbf24"/>
    <text x="24" y="14.5" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="9" font-weight="600">BROTHER UYUMLU</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlowKyo" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGradKyo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="#030712" rx="16"/>
  <rect width="400" height="300" fill="url(#bgGlowKyo)" rx="16"/>

  <!-- Kyocera Tubular Toner Cartridge Shape -->
  <g transform="translate(45, 80)">
    <ellipse cx="155" cy="120" rx="145" ry="14" fill="#000000" opacity="0.6"/>

    <!-- Cylindrical High Capacity Tube -->
    <rect x="25" y="30" width="260" height="65" rx="20" fill="url(#bodyGradKyo)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Left Cap & Drive Key -->
    <rect x="15" y="40" width="18" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="24" cy="62" r="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect x="21" y="56" width="6" height="12" rx="1" fill="#10b981"/>

    <!-- Right Dispenser Funnel & Shutter -->
    <rect x="275" y="38" width="18" height="48" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="282" y="46" width="14" height="16" rx="3" fill="#059669"/>
    <circle cx="289" cy="54" r="3" fill="#ffffff"/>

    <!-- Ribs -->
    <g stroke="#334155" stroke-width="1.5">
      <line x1="60" y1="45" x2="250" y2="45"/>
      <line x1="60" y1="62" x2="250" y2="62"/>
      <line x1="60" y1="78" x2="250" y2="78"/>
    </g>

    <!-- Badge -->
    <rect x="95" y="45" width="120" height="36" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.2"/>
    <text x="155" y="62" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">KYOCERA TK TONER</text>
    <text x="155" y="74" fill="#a7f3d0" font-family="monospace" font-size="8" text-anchor="middle">AA KALİTE MICRO-POWDER</text>
  </g>

  <g transform="translate(20, 20)">
    <rect width="135" height="22" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="12" cy="11" r="3.5" fill="#34d399"/>
    <text x="24" y="14.5" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="9" font-weight="600">KYOCERA UYUMLU</text>
  </g>
</svg>
